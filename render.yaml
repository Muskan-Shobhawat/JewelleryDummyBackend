# Render Blueprint: deploy the API as a free web service (https://render.com/docs/blueprint-spec)
services:
  - type: web
    name: kanak-jewellers-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        # set this to the deployed frontend URL(s), comma separated
        value: https://kanak-jewellers.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_API_KEY
        value: admin-demo-key
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_OTP
        value: "123456"
      - key: RATE_TICK_SECONDS
        value: "30"
